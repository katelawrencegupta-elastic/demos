# Elastic Co. — fictional multi-tenant fulfillment SaaS.
# All generators share this model so logs, traces, and K8s events correlate.
company: Elastic Co.
domain: elastic.co
seed: 7

tenants:
  - id: acme-retail
    name: Acme Retail
    blast: true
    slo_target_ms: 400
  - id: globex-mart
    name: Globex Mart
    blast: false
    slo_target_ms: 400
  - id: initech-b2b
    name: Initech B2B
    blast: false
    slo_target_ms: 500

cluster:
  name: eks-elastic-prod-usc1
  cloud: aws
  region: us-east-1
  namespaces:
    - fulfillment
    - payments
    - platform
  nodes:
    - name: ip-10-0-12-21.ec2.internal
      az: us-east-1a
    - name: ip-10-0-14-44.ec2.internal
      az: us-east-1b
    - name: ip-10-0-18-7.ec2.internal
      az: us-east-1c

services:
  - name: edge-gateway
    namespace: fulfillment
    language: go
    type: gateway
    version: "1.9.2"
    replicas: 2
    mem_limit_mi: 256
  - name: identity-service
    namespace: platform
    language: go
    type: app
    version: "2.3.1"
    replicas: 2
    mem_limit_mi: 256
  - name: checkout-api
    namespace: fulfillment
    language: java
    type: app
    deploy_good: "2.4.0"
    deploy_bad: "2.4.1"
    replicas: 3
    mem_limit_mi: 512
  - name: inventory-service
    namespace: fulfillment
    language: go
    type: app
    version: "4.0.8"
    replicas: 2
    mem_limit_mi: 256
  - name: fraud-service
    namespace: payments
    language: python
    type: app
    version: "1.7.0"
    replicas: 2
    mem_limit_mi: 384
  - name: payments-api
    namespace: payments
    language: go
    type: app
    version: "3.1.0"
    replicas: 2
    mem_limit_mi: 256
  - name: notification-service
    namespace: platform
    language: go
    type: app
    version: "1.4.2"
    replicas: 2
    mem_limit_mi: 256
  - name: orchestrator
    namespace: platform
    language: python
    type: airflow
    version: "2.8.1"
    replicas: 1
    mem_limit_mi: 512
  - name: orders-db
    namespace: fulfillment
    language: sql
    type: db
    system: postgresql
    version: "16.2"
    replicas: 1
    mem_limit_mi: 2048
  - name: inventory-db
    namespace: fulfillment
    language: sql
    type: db
    system: postgresql
    version: "16.2"
    replicas: 1
    mem_limit_mi: 2048
  - name: redis-cart
    namespace: fulfillment
    language: redis
    type: cache
    version: "7.2.4"
    replicas: 2
    mem_limit_mi: 512
  - name: kafka
    namespace: platform
    language: kafka
    type: messaging
    version: "3.7.0"
    replicas: 3
    mem_limit_mi: 1024

orchestrator:
  dag_id: fulfillment.checkout
  task_ids:
    - validate_cart
    - reserve_inventory
    - charge_payment
    - emit_fulfillment

incident:
  name: acme-checkout-degradation
  # Relative to backfill/stream anchor (utcnow). Occupies the last 60 minutes
  # through "now" so 60-minute alerts and SLO burn still fire after backfill.
  start_offset_minutes: 60
  duration_minutes: 60
  blast_tenant: acme-retail
  bad_deploy_version: "2.4.1"
  root_cause: >
    checkout-api v2.4.1 memory leak → OOMKills → orchestrator retries amplify
    DB lock contention → slow SELECT … FOR UPDATE on orders for acme-retail.
  hero_trace_count: 8

alerts:
  noisy:
    name: elasticco-noisy-node-cpu
    description: CPU > 70% on any node (no service/tenant context)
  quality:
    name: elasticco-checkout-correlated-rca
    description: OOM + slow DB + OOM logs for acme-retail (RCA starter, not an SLO)
  eks_restarts:
    name: elasticco-eks-pod-restarts
    description: OOMKilled / BackOff / restart count on checkout-api (opens a case)
  app_monitoring:
    name: elasticco-app-checkout-error-rate
    description: checkout-api transaction error rate > 10% with tenant context

app_monitoring:
  monitored_service: checkout-api
  blast_tenant: acme-retail
  error_rate_threshold: 0.10
  slo_target_ms: 400
  rca_agent:
    name: elasticco-rca-agent
    default_email: kate.lawrencegupta@elastic.co
    approval_required: true
  remediation:
    rollback_version: "2.4.0"
    actions:
      - Roll back checkout-api Deployment to v2.4.0
      - Pause orchestrator DAG fulfillment.checkout retries for acme-retail
      - Verify acme-retail p95 checkout latency < 400ms
