efore they open it, and the Brightwell Sentry Eye SD-5 puts a camera directly into the deadbolt housing. The exterior panel holds a 2-megapixel wide-angle lens with a 150-degree field of view, infrared night vision up to 25 feet, and a motion-triggered recording mode. The lock body is zinc alloy with a satin nickel finish, and the bolt throws a full one inch. You can unlock using a fingerprint reader on the exterior, a keypad with up to 50 codes, or the Brightwell app, which streams live video over Wi-Fi. Clips are saved to a microSD card of up to 128 gigabytes or to an optional cloud subscription. The SD-5 relies on a rechargeable battery pack that lasts about three months between charges, and a USB-C port makes charging simple. Video quality may decline in very low light or when the Wi-Fi signal is weak. Keep the lens clean by wiping it with a soft microfiber cloth, avoiding harsh chemicals. Check the microSD card every few months to confirm recording continues. Brightwell offers a two-year warranty on the lock and a one-year warranty on the camera module. The SD-5 suits front doors with reliable internet service, and its camera is meant to supplement, not replace, conventional home security practices."]}, "hybrid": {"know when someone is at my front door while I'm away": {"bm25": {"took": 2, "total": 1254, "hits": [{"sku": "SKU-0181", "name": "Aurelle Pro 3000", "category": "home espresso & kitchen appliances", "sub": "espresso machines", "price": 1299, "score": 10.658}, {"sku": "SKU-0477", "name": "Hearthline Video Chime", "category": "smart home & security devices", "sub": "video doorbells", "price": 79.0, "score": 9.166}, {"sku": "SKU-0469", "name": "Vigil 360 Pro", "category": "smart home & security devices", "sub": "indoor and outdoor security cameras", "price": 79.99, "score": 9.077}, {"sku": "SKU-0653", "name": "Pedalmark BasicTrip W", "category": "bike components & accessories", "sub": "bike computers", "price": 19.99, "score": 8.978}, {"sku": "SKU-0044", ergonomic office chairs", "price": 89.99, "score": 0.727}, {"sku": "SKU-0362", "name": "Vantora Lumbar Pro 7", "category": "home office & ergonomic furniture", "sub": "ergonomic office chairs", "price": 389, "score": 0.725}, {"sku": "SKU-0037", "name": "Haven Lumbar Support Cushion", "category": "home office & ergonomic furniture", "sub": null, "price": 39.99, "score": 0.715}]}, "rrf": {"took": 32, "total": 1207, "hits": [{"sku": "SKU-0031", "name": "Stratus Pro Mesh Task Chair", "category": "home office & ergonomic furniture", "sub": null, "price": 389.0, "score": 0.032}, {"sku": "SKU-0364", "name": "Kestrel Executive Lounge KX-12", "category": "home office & ergonomic furniture", "sub": "ergonomic office chairs", "price": 649, "score": 0.027}, {"sku": "SKU-0363", "name": "Corvane Stride Mesh Task", "category": "home office & ergonomic furniture", "sub": "ergonomic office chairs", "price": 219.99, "score": 0.016}, {"sku": "SKU-1161", "name": "Stipple Dome 12", "category": "beauty & personal care", "sub": "makeup brushes and tools", "price": 34.0, "score": 0.016}, {"sku": "SKU-0369", "name": "Comfy-Plus Mid-Back", "category": "home office & ergonomic furniture", "sub": "ergonomic office chairs", "price": 89.99, "score": 0.016}]}, "rerank": {"took": 336, "total": 1207, "hits": [{"sku": "SKU-0363", "name": "Corvane Stride Mesh Task", "category": "home office & ergonomic furniture", "sub": "ergonomic office chairs", "price": 219.99, "score": 1.09}, {"sku": "SKU-0369", "name": "Comfy-Plus Mid-Back", "category": "home office & ergonomic furniture", "sub": "ergonomic office chairs", "price": 89.99, "score": 1.066}, {"sku": "SKU-0362", "name": "Vantora Lumbar Pro 7", "category": "home office & ergonomic furniture", "sub": "ergonomic office chairs", "price": 389, "score": 1.064}, {"sku": "SKU-0031", "name": "Stratus Pro Mesh Task Chair", "category": "home office & ergonomic furniture", "sub": null, "price": 389.0, "score": 1.02}, {"sku": "SKU-0367", "name": "Quill Sit-Stand n vests", "price": 124.95, "score": 0.016}, {"sku": "SKU-0689", "name": "Pebble Duo", "category": "audio & consumer electronics", "sub": "wireless earbuds", "price": 14.99, "score": 0.016}, {"sku": "SKU-0339", "name": "Coast Runner 6L Modular Running Vest", "category": "running & fitness wearables", "sub": "hydration vests", "price": 64.95, "score": 0.016}, {"sku": "SKU-0706", "name": "Retro Suitcase RX-45 Turntable", "category": "audio & consumer electronics", "sub": "turntables", "price": 129.99, "score": 0.016}, {"sku": "SKU-0218", "name": "Minimal 01", "category": "running & fitness wearables", "sub": "running shoes", "price": 84.99, "score": 0.016}]}, "rerank": {"took": 341, "total": 1243, "hits": [{"sku": "SKU-0689", "name": "Pebble Duo", "category": "audio & consumer electronics", "sub": "wireless earbuds", "price": 14.99, "score": 1.109}, {"sku": "SKU-0333", "name": "Pulse 5L Lightweight Running Vest", "category": "running & fitness wearables", "sub": "hydration vests", "price": 54.0, "score": 1.021}, {"sku": "SKU-0267", "name": "Stride Band", "category": "running & fitness wearables", "sub": "heart rate monitors and fitness trackers", "price": 59.95, "score": 1.001}, {"sku": "SKU-0021", "name": "Stride Pro GPS Running Watch", "category": "running & fitness wearables", "sub": null, "price": 299.0, "score": 0.986}, {"sku": "SKU-0214", "name": "Cloudstep Lite", "category": "running & fitness wearables", "sub": "running shoes", "price": 74.99, "score": 0.983}]}}}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={step:0,story:0,tab:{},seen:new Set()};
const MAIN=D.main_query, STORIES=D.stories;
const short=s=>s.length>46?s.slice(0,44)+'…':s;
const q=()=>STORIES[state.story];
const dc=Object.entries(D.dept_counts).sort((a,b)=>b[1]-a[1]);
const nProd=D.counts['products-jina'];
const M=D.models;

function req(method,path,body){return method+' '+path+(body?'\n'+JSON.stringify(body,null,2):'');}
function reqBlock(text){return `<div class="reqwrap"><pre>${esc(text)}</pre><button class="sm copy" data-copy="${esc(text)}">Copy</button></div>`;}
function storyTabs(){return `<div class="tabs" role="tablist" aria-label="Choose a query">${STORIES.map((s,i)=>`<button class="pill ${i===state.story?'on':''}" data-story="${i}">${esc(short(s))}</button>`).join('')}</div>`;}
function hits(res,mark={}){return res.hits.map((h,i)=>`<div class="hit"><span class="rank">${i+1}</span><div><span class="n">${esc(h.name)}</span>${mark[h.sku]||''}<div class="c">${esc(h.category||'')}${h.sub?' › '+esc(h.sub):''}</div></div><span class="c">${h.price!=null?'$'+h.price:''}</span></div>`).join('');}
function col(title,meta,res,mark){return `<div class="col"><h4>${title}</h4><div class="meta">${meta} · took ${res.took} ms</div>${hits(res,mark)}</div>`;}
const bd=(t,w)=>`<span class="badge ${w?'w':''}">${t}</span>`;
function panel(t,inner,cls=''){return `<div class="panel ${cls}"><h3>${t}</h3>${inner}</div>`;}
function modelChip(id){const m=M[id];const bits=[m.task_type.replace('_',' '),m.dimensions?m.dimensions+' dims':null,m.similarity].filter(Boolean).join(' · ');return `<div class="chip"><b>${esc(m.model_id||id)}</b><code>${esc(id)}</code><br><span>${esc(bits)} · service: ${esc(m.service)}</span></div>`;}
function fmtBytes(b){const u=['B','KB','MB','GB','TB','PB'];let i=0;while(b>=1000&&i<u.length-1){b/=1000;i++}return (b>=100?b.toFixed(0):b>=10?b.toFixed(1):b.toFixed(2))+' '+u[i];}

const steps=[
{t:'Set the stage',s:'What is loaded, which models',
 goal:`${nProd.toLocaleString()} products with long descriptions sit in five indices. Each index holds the same products embedded a different way, so every comparison later is like for like.`,
 say:['“This is a product catalog with long, realistic descriptions. There is no embedding code in my application. I only declare a field and name an inference endpoint.”','“Every model here runs on the Elastic Inference Service, so there are no ML nodes to size.”'],
 body:()=>{
  const rows=[['products-elser','.elser-2-elastic','sparse'],['products-jina','.jina-embeddings-v5-text-small','dense, '+M['.jina-embeddings-v5-text-small'].dimensions+' dims'],['products-large-float','.openai-text-embedding-3-large','dense, '+M['.openai-text-embedding-3-large'].dimensions+' dims, full float'],['products-large-int8','.openai-text-embedding-3-large','dense, int8 quantized'],['products-large-bbq','.openai-text-embedding-3-large','dense, BBQ quantized + rescoring']];
  return panel('Calls to run',reqBlock(req('GET','_inference/.jina-embeddings-v5-text-small'))+reqBlock(req('GET','products-jina/_mapping?filter_path=*.mappings.properties.description_semantic')))
  +panel('Models used',`<div class="chips">${['.elser-2-elastic','.jina-embeddings-v5-text-small','.openai-text-embedding-3-large','.jina-reranker-v3'].map(modelChip).join('')}</div><p style="color:var(--mut);margin:10px 0 0;font-size:14px">This project lists ${D.catalog.total} inference endpoints: ${D.catalog.embedding} embedding, ${D.catalog.rerank} rerank and ${D.catalog.chat} chat completion.</p>`)
  +panel('Outcome: indices and what is in them',`<table><tr><th>Index</th><th>Embedding endpoint</th><th>Type</th><th class="r">Products</th></tr>${rows.map(r=>`<tr><td><code>${r[0]}</code></td><td><code>${r[1]}</code></td><td>${r[2]}</td><td class="r">${D.counts[r[0]].toLocaleString()}</td></tr>`).join('')}</table>
   <p style="margin:12px 0 4px;color:var(--mut);font-size:14px">Departments (${dc.length}): ${dc.map(([k,v])=>`${esc(k)} (${v})`).join(' · ')}</p>`)
  +panel('Field mapping returned by the cluster',`<pre>${esc(JSON.stringify({description_semantic:D.mappings['products-jina']},null,2))}</pre>`);},
 watch:['Point at the mapping: one semantic_text field, an inference ID, and chunking settings. That is the whole integration.']},

{t:'Keyword vs semantic',s:'Same question, two retrieval styles',
 goal:'Show where keyword matching goes wrong on long descriptions and where meaning-based retrieval stays on topic.',
 say:['“I will ask the way a shopper would, not with product keywords. First with BM25, which matches words.”','“Now the same question with semantic search. Same index, same data, one different query clause.”','Ask the audience to predict before you run each one.'],
 body:()=>{const r=D.compare[q()];
  return storyTabs()
  +panel('Calls to run',reqBlock(req('GET','products-jina/_search',{size:5,_source:['name','category'],query:{match:{description:q()}}}))+reqBlock(req('GET','products-jina/_search',{size:5,_source:['name','category'],query:{semantic:{field:'description_semantic',query:q()}}})))
  +panel('Outcome',`<div class="cols">${col('Keyword (BM25)','matches words in the description',r.bm25)}${col('Semantic','embeds the question, matches meaning',r.jina)}</div>`)
  +panel('Model used',`<div class="chips">${modelChip('.jina-embeddings-v5-text-small')}</div>`);},
 watch:['Look at ranks 2 to 5 of the keyword column. Long descriptions share many words with unrelated products.','The query is embedded by EIS at search time, which is why the first call to an index can be a little slower.']},

{t:'Swap the model',s:'ELSER vs Jina vs OpenAI, no code change',
 goal:'Run the same question on three different embedding models by changing only the index (and so the inference ID).',
 say:['“Sparse, 1,024-dimension dense and 3,072-dimension dense. Same query, same application code.”','“Results are close. The choice is about cost, latency, language and domain, and it is a configuration change, not a rewrite.”'],
 body:()=>{const r=D.compare[q()];const sets=[r.elser,r.jina,r.large_bbq].map(x=>new Set(x.hits.map(h=>h.sku)));const all=new Set([...sets[0]].filter(s=>sets[1].has(s)&&sets[2].has(s)));const mk={};all.forEach(s=>mk[s]=bd('in all 3'));
  return storyTabs()
  +panel('Calls to run',reqBlock(req('GET','products-elser/_search',{size:5,query:{semantic:{field:'description_semantic',query:q()}}}))+reqBlock('# same body, change only the index:\nGET products-jina/_search\nGET products-large-bbq/_search'))
  +panel('Outcome',`<div class="cols">${col('ELSER','sparse · .elser-2-elastic',r.elser,mk)}${col('Jina v5 small','dense 1024 · .jina-embeddings-v5-text-small',r.jina,mk)}${col('OpenAI 3-large','dense 3072 · BBQ',r.large_bbq,mk)}</div><p style="color:var(--mut);font-size:14px">${all.size} of 5 results are shared by all three models for this query.</p>`)
  +panel('Models used',`<div class="chips">${modelChip('.elser-2-elastic')}${modelChip('.jina-embeddings-v5-text-small')}${modelChip('.openai-text-embedding-3-large')}</div>`);},
 watch:['Do not oversell differences between models. Say what you see: results overlap strongly and the ordering differs a little.']},

{t:'Large embeddings',s:'float vs int8 vs BBQ',
 goal:'Same 3,072-dimension model, three storage formats. Show the answers agree while the memory footprint drops by an order of magnitude.',
 say:['“Same model, same vectors. Only the index_options differ.”','“BBQ keeps one bit per dimension plus corrections in memory, and rescores the top candidates with the original vectors.”'],
 body:()=>{
  const r=D.large[q()]||D.large[MAIN];const qq=D.large[q()]?q():MAIN;const fl=r.float.hits.map(h=>h.sku);const mk=k=>{const o={};r[k].hits.forEach((h,i)=>{o[h.sku]=h.sku===fl[i]?bd('= float'):bd('moved',1)});return o;};
  const ov=D.overlap;const mm=D.mappings;
  const opt=k=>{const o=mm['products-large-'+k].index_options;return o?JSON.stringify(o.dense_vector||o):'default'};
  const dims=M['.openai-text-embedding-3-large'].dimensions;
  return `<div class="tabs">${Object.keys(D.large).map(s=>`<button class="pill ${s===qq?'on':''}" data-lstory="${esc(s)}">${esc(short(s))}</button>`).join('')}</div>`
  +panel('Calls to run',reqBlock(req('GET','products-large-bbq/_mapping?filter_path=*.mappings.properties.description_semantic'))+reqBlock('# tip: the same filter_path call works on products-large-float and -int8 to compare index_options\n# (the field-level _mapping/field API is not available on Serverless)')+reqBlock('# same query on each format:\n'+req('GET','products-large-float/_search',{size:5,query:{semantic:{field:'description_semantic',query:qq}}})+'\n\nGET products-large-int8/_search   # same body\nGET products-large-bbq/_search    # same body'))
  +panel('Mappings returned (index_options)',`<table><tr><th>Index</th><th>index_options.dense_vector</th></tr>${['float','int8','bbq'].map(k=>`<tr><td><code>products-large-${k}</code></td><td><code>${esc(opt(k))}</code></td></tr>`).join('')}</table>`)
  +panel('Outcome: same query, three formats',`<div class="cols">${col('float32','full precision',r.float)}${col('int8','quantized',r.int8,mk('int8'))}${col('BBQ','1 bit + rescoring',r.bbq,mk('bbq'))}</div>`)
  +panel(`Agreement across ${ov.n} queries`,`<div class="stat"><div><b>${Math.round(ov['bbq@10']*100)}%</b><span>BBQ top-10 overlap with float</span></div><div><b>${Math.round(ov['int8@10']*100)}%</b><span>int8 top-10 overlap with float</span></div><div><b>${ov.bbq_top1_same}/${ov.n}</b><span>queries where BBQ top-1 = float top-1</span></div><div><b>${Math.round(ov['bbq@3']*100)}%</b><span>BBQ top-3 overlap</span></div></div><p style="color:var(--mut);font-size:15px;margin:0">Measured against the ${nProd.toLocaleString()}-product catalog. This shows agreement on these queries. It is not a recall benchmark, so benchmark on the customer's own data before promising numbers.</p>`)
  +panel('Memory math (vector data only)',`<p style="margin:0 0 8px">Vectors: <input type="number" id="nvec" min="1000" step="1000" value="${state.nvec||10000000}"> ${[1e6,1e7,1e8].map(n=>`<button class="pill" data-nvec="${n}">${n>=1e8?'100M':n>=1e7?'10M':'1M'}</button>`).join(' ')}</p><div id="mem"></div>`);},
 after:()=>{const f=()=>{const n=Math.max(1,+$('#nvec').value||1e7);state.nvec=n;const d=M['.openai-text-embedding-3-large'].dimensions;const rows=[['float32',4*d],['int8',d+4],['BBQ',d/8+14]];$('#mem').innerHTML=`<table><tr><th>Format</th><th class="r">Per vector</th><th class="r">Total</th><th class="r">vs float</th></tr>${rows.map((r,i)=>`<tr class="${i==2?'hl':''}"><td>${r[0]}</td><td class="r">${fmtBytes(r[1])}</td><td class="r">${fmtBytes(r[1]*n)}</td><td class="r">${(rows[0][1]/r[1]).toFixed(1)}x smaller</td></tr>`).join('')}</table><p style="color:var(--mut);font-size:13px;margin:8px 0 0">${d} dimensions. int8 = 1 byte per dimension + 4. BBQ = 1 bit per dimension + 14 bytes of corrections. Excludes the HNSW graph.</p>`};$('#nvec').oninput=f;f();document.querySelectorAll('[data-nvec]').forEach(b=>b.onclick=()=>{$('#nvec').value=b.dataset.nvec;f()});},
 watch:['Say this out loud: on disk the quantized indices are not smaller, because the original vectors are kept for rescoring. The savings are in RAM and in the HNSW structure.']},

{t:'Chunks and footprint',s:'Long text handling, memory vs disk',
 goal:'Show that long descriptions are split into chunks automatically, then size the vector footprint of each format from the real chunk count.',
 say:['“Each description is hundreds of words. Elastic splits it into sentence-based chunks, embeds each chunk, and returns the best matching chunk.”','“Here is the real count: products versus chunk documents. From that I can size the vectors exactly for each format.”','“Quantization shrinks what must stay in memory. On disk it adds a small compressed copy next to the original vectors, which are kept so the top results can be rescored.”'],
 body:()=>{const c=D.chunking,cs=D.chunk_stats;
  return panel('Calls to run',reqBlock(req('GET','products-jina/_count'))+reqBlock(req('GET','_cat/indices/products-*?v&h=index,docs.count&s=index'))+reqBlock(req('GET','products-jina/_search',{size:1,query:{semantic:{field:'description_semantic',query:MAIN}},highlight:{fields:{description_semantic:{number_of_fragments:3}}}})))
  +panel('Outcome: products vs chunk documents',`<div class="stat"><div><b>${cs.products.toLocaleString()}</b><span>products (<code>_count</code>)</span></div><div><b>${cs.docs_total.toLocaleString()}</b><span>documents in <code>_cat/indices</code></span></div><div><b>${cs.chunks.toLocaleString()}</b><span>chunk documents, avg ${cs.avg_chunks_per_product} per product</span></div></div>`)
  +panel('Outcome: chunks returned for the best match',`<p style="margin:0 0 6px"><b>${esc(c.name)}</b> (${esc(c.sku)}), ${c.words} words, query: “${esc(MAIN)}”</p>${c.fragments.map((f,i)=>`<div class="frag"><b>Chunk ${i+1}</b>\n${esc(f.trim())}</div>`).join('')}<p style="color:var(--mut);font-size:15px;margin:6px 0 0">Chunking setting: <code>${esc(JSON.stringify(D.mappings['products-jina'].chunking_settings))}</code></p>`)
  +panel('Calculated vector footprint (not measured)',`<table><tr><th>Index</th><th>Format</th><th class="r">Vectors</th><th class="r">Must stay in memory</th><th class="r">On disk (original + quantized)</th></tr>${D.footprint.map((f,i)=>`<tr class="${f.index==='products-large-bbq'?'hl':''}"><td><code>${f.index}</code></td><td>${esc(f.label)}</td><td class="r">${f.vectors.toLocaleString()}</td><td class="r">${fmtBytes(f.ram_bytes)}</td><td class="r">${fmtBytes(f.disk_bytes)}</td></tr>`).join('')}</table><p style="color:var(--mut);font-size:15px;margin:10px 0 0">Calculated from the chunk count above: float = 4 bytes per dimension, int8 = 1 byte per dimension + 4, BBQ = 1 bit per dimension + 14. Excludes the HNSW graph and sparse ELSER vectors. Quantized formats keep the original vectors for rescoring, so disk goes up slightly while memory drops sharply. Use the memory calculator on step 4 to scale this to your vector count.</p>`);},
 watch:['Do not show store.size live. On Serverless, _cat/indices reports only node-local data, so it swings between 0b, kilobytes and megabytes and does not reflect the real index size. _stats, _cat/shards and _disk_usage are not available.','The documents column includes chunk documents, which is why it is higher than the product count.']},

{t:'Hybrid and rerank',s:'BM25 + vectors with RRF, then a reranker',
 goal:'Combine keyword and semantic retrieval, then optionally rerank. Show what each stage changes.',
 say:['“RRF merges the two rankings without score tuning. Anything both methods agree on rises.”','“Reranking is one more clause. It reorders the shortlist with a cross-encoder model.”','Be candid: reranking pays off most with large candidate sets and long, messy documents.'],
 body:()=>{const hs=Object.keys(D.hybrid);const s=hs.includes(q())?q():hs[0];const r=D.hybrid[s];const rr={};r.rrf.hits.forEach((h,i)=>rr[h.sku]=i);const mk={};r.rerank.hits.forEach((h,i)=>{const p=rr[h.sku];mk[h.sku]=p===undefined?bd('new',1):p===i?'':bd((p>i?'▲ ':'▼ ')+Math.abs(p-i),p<i)});
  const body={size:5,retriever:{text_similarity_reranker:{retriever:{rrf:{rank_window_size:20,retrievers:[{standard:{query:{match:{description:s}}}},{standard:{query:{semantic:{field:'description_semantic',query:s}}}}]}},field:'description',inference_id:'.jina-reranker-v3',inference_text:s,rank_window_size:20}}};
  return `<div class="tabs">${hs.map(x=>`<button class="pill ${x===s?'on':''}" data-hstory="${esc(x)}">${esc(short(x))}</button>`).join('')}</div>`
  +panel('Pipeline',`<div class="flow"><span class="node">BM25 top 20</span><span class="arr">+</span><span class="node">Semantic top 20</span><span class="arr">→</span><span class="node">RRF merge</span><span class="arr">→</span><span class="node">.jina-reranker-v3</span><span class="arr">→</span><span class="node">top 5</span></div>`)
  +panel('Call to run',reqBlock(req('GET','products-jina/_search',body)))
  +panel('Outcome: each stage',`<div class="cols">${col('BM25','keyword only',r.bm25)}${col('Semantic','dense only',r.semantic)}${col('RRF','BM25 + semantic merged',r.rrf)}${col('RRF + rerank','reordered by reranker',r.rerank,mk)}</div>`)
  +panel('Models used',`<div class="chips">${modelChip('.jina-embeddings-v5-text-small')}${modelChip('.jina-reranker-v3')}</div>`);},
 watch:['Badges on the last column show rank movement from RRF. If the reranker mostly reorders the same items, say so: it is a precision step, not a magic fix.']},

{t:'Wrap up',s:'What to take away',
 goal:'Land three points and hand over to the RAG demo.',
 say:['“One field, any model: embeddings are a configuration choice on EIS, with no ML nodes to manage.”','“Quantization and chunking are what make large embeddings practical. Memory drops by about 30 times at the format level, and the answers agreed on our queries.”','“Hybrid retrieval gives you both exact terms and meaning, and reranking is an optional extra.”'],
 body:()=>panel('Recap of the calls',`<table><tr><th>Step</th><th>API</th><th>Model(s)</th></tr>
 <tr><td>1 Stage</td><td><code>GET _inference/{id}</code>, <code>GET {index}/_mapping</code></td><td>all</td></tr>
 <tr><td>2 Keyword vs semantic</td><td><code>_search</code> with <code>match</code> and <code>semantic</code></td><td>Jina v5 small</td></tr>
 <tr><td>3 Swap model</td><td><code>_search</code> on each index</td><td>ELSER, Jina v5, OpenAI 3-large</td></tr>
 <tr><td>4 Large embeddings</td><td><code>_mapping</code>, <code>_search</code> on float / int8 / BBQ</td><td>OpenAI 3-large</td></tr>
 <tr><td>5 Chunks and footprint</td><td><code>_count</code>, <code>_cat/indices</code> (docs.count), <code>_search</code> with <code>highlight</code></td><td>Jina v5 small</td></tr>
 <tr><td>6 Hybrid</td><td><code>_search</code> with <code>retriever</code> (rrf, text_similarity_reranker)</td><td>Jina v5 small, Jina reranker v3</td></tr></table>`)
 +panel('If something goes wrong',`<ul style="margin:0;padding-left:20px"><li>Slow first query: run each block once before the session so the path is warm.</li><li>Unexpected results: switch to another story tab above, they were chosen from tested queries.</li><li>No cluster access: this page holds the results captured at ${esc(D.captured)}.</li></ul>`),
 watch:[]}
];

function render(){
  const s=steps[state.step];state.seen.add(state.step);
  $('#prog').style.width=((state.step+1)/steps.length*100)+'%';
  $('#steps').innerHTML=steps.map((x,i)=>`<button class="stepbtn ${i===state.step?'on':''} ${state.seen.has(i)&&i!==state.step?'done':''}" data-go="${i}" ${i===state.step?'aria-current="step"':''}><span class="num">${i+1}</span><span>${esc(x.t)}<small>${esc(x.s)}</small></span></button>`).join('');
  $('#main').innerHTML=`<div class="kick">Step ${state.step+1} of ${steps.length}</div><h2>${esc(s.t)}</h2><p class="goal">${esc(s.goal)}</p>`
   +panel('Say',s.say.map(x=>`<p>${esc(x)}</p>`).join(''),'say')
   +s.body()
   +(s.watch&&s.watch.length?panel('Watch-outs',`<ul>${s.watch.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,'watch'):'')
   +`<div class="nav2"><button class="big ghost" data-dir="-1" ${state.step===0?'disabled':''}>&larr; Back</button><button class="big" data-dir="1" ${state.step===steps.length-1?'disabled':''}>Next &rarr;</button></div>
   <div class="foot">Results captured live from the cluster on ${esc(D.captured)}. API key and hostnames are not included.</div>`;
  if(s.after)s.after();
}
function go(i){state.step=Math.max(0,Math.min(steps.length-1,i));history.replaceState(null,'','#'+(state.step+1));render();$('#main').focus({preventScroll:true});window.scrollTo({top:0});}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.go!==undefined)go(+t.dataset.go);
  else if(t.dataset.dir)go(state.step+ +t.dataset.dir);
  else if(t.dataset.story!==undefined){state.story=+t.dataset.story;render();}
  else if(t.dataset.lstory!==undefined){state.story=Math.max(0,STORIES.indexOf(t.dataset.lstory));render();}
  else if(t.dataset.hstory!==undefined){state.story=Math.max(0,STORIES.indexOf(t.dataset.hstory));render();}
  else if(t.dataset.copy!==undefined){navigator.clipboard&&navigator.clipboard.writeText(t.dataset.copy).then(()=>{t.textContent='Copied';setTimeout(()=>t.textContent='Copy',1200)}).catch(()=>{});}
  else if(t.id==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';}
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(state.step+1);if(e.key==='ArrowLeft')go(state.step-1);});
const h0=parseInt((location.hash||'').slice(1),10);if(h0>=1&&h0<=steps.length)state.step=h0-1;
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n>=1&&n<=steps.length){state.step=n-1;render();}});
render();
</script>
</body>
</html>
