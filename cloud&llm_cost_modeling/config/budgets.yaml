# ELK Co FinOps spend budgets — thresholds from the AWS FinOps workshop
# calibration (intentionally tight so spend SLOs / alerts can fire).
# Calibrated 2026-08-27 against Serverless backfill (~120d):
#   AWS CUR 30d total ~$220k, daily avg ~$7.4k
#   elk-staging daily ~$1.0k (cost_leak)
#   checkout-assistant 7d LLM ~$5.5 (agent-loop spike days $2–3.5)
#   elk-ml-prod GCP 7d ~$7.2k

tags:
  - elk-co
  - finops
  - workshop

# Dashboard / alert shared numbers
budgets:
  aws_monthly_usd: 150000          # below ~$220k trailing-30d burn
  aws_daily_ceiling_usd: 5200      # ~0.7× 30d daily avg — crypto/growth burn days
  staging_daily_ceiling_usd: 150   # cost_leak ~$1k/day → chronically breached
  staging_daily_alert_usd: 200
  checkout_daily_ceiling_usd: 0.50 # agent-loop days $2–3.5; normal ~$0.45–0.58 → chronic breach
  checkout_7d_alert_usd: 4.0       # 7d sum ~$5.5
  gcp_ml_7d_alert_usd: 4000        # elk-ml-prod 7d ~$7.2k
  bedrock_daily_ceiling_usd: 25    # APM gen_ai aws.bedrock daily cost (tight for demos)
  bedrock_7d_alert_usd: 80
  inference_daily_tokens: 200000   # Agent Builder inference tokens/day
  inference_7d_tokens: 800000

slos:
  - id: elk-slo-aws-daily-spend
    name: "[ELK Co] AWS daily unblended under budget"
    description: >
      Daily AWS CUR unblended cost must stay at or below the FinOps ceiling.
      Crypto-mining (−12..−9) and organic growth burn error budget.
    index: metrics-aws_billing.cur-default
    filter: ""
    field: aws_billing.cur.line_item.unblended_cost
    ceiling_key: aws_daily_ceiling_usd
    burn_rate_alert: false

  - id: elk-slo-staging-cost-leak
    name: "[ELK Co] Staging account daily spend healthy"
    description: >
      elk-staging daily CUR spend under a healthy baseline. The ongoing
      cost_leak scenario (~orphaned EC2/RDS) keeps this SLO breached.
    index: metrics-aws_billing.cur-default
    filter: 'aws_billing.cur.line_item.usage_account_name : "elk-staging"'
    field: aws_billing.cur.line_item.unblended_cost
    ceiling_key: staging_daily_ceiling_usd
    burn_rate_alert: true

  - id: elk-slo-llm-checkout-spend
    name: "[ELK Co] checkout-assistant daily LLM cost"
    description: >
      Daily gen_ai span cost for checkout-assistant under ceiling. The
      llm_agent_loop scenario (−8..−6, ×12) burns this budget.
    index: traces-apm-default
    filter: 'span.subtype : "gen_ai" and service.name : "checkout-assistant"'
    field: labels.llm_cost_usd
    ceiling_key: checkout_daily_ceiling_usd
    burn_rate_alert: true

  - id: elk-slo-bedrock-daily-spend
    name: "[ELK Co] Bedrock daily LLM cost"
    description: >
      Daily APM gen_ai cost for aws.bedrock under ceiling. Useful for the
      bedrock workshop variant (and all when Bedrock traffic is seeded).
    index: traces-apm-default
    filter: 'span.subtype : "gen_ai" and gen_ai.system : "aws.bedrock"'
    field: labels.llm_cost_usd
    ceiling_key: bedrock_daily_ceiling_usd
    burn_rate_alert: true

  - id: elk-slo-inference-daily-tokens
    name: "[ELK Co] Elastic Inference daily token budget"
    description: >
      Daily Elastic Inference tokens for Agent Builder under ceiling.
    index: logs-elastic.inference_token_usage-default
    filter: 'inference.feature_id : "agent_builder" or tags : "synthetic"'
    field: token_usage.total_tokens
    ceiling_key: inference_daily_tokens
    burn_rate_alert: false

alerts:
  - id: elk-alert-aws-mtd-budget
    name: "[ELK Co] AWS trailing-30d spend over monthly budget"
    description: Trailing 30-day CUR unblended cost exceeds the monthly FinOps budget.
    schedule: 1h
    time_window_size: 30
    time_window_unit: d
    kind: aws_mtd

  - id: elk-alert-staging-daily
    name: "[ELK Co] Staging cost-leak daily burn"
    description: elk-staging daily CUR spend above cost-leak alert floor.
    schedule: 1h
    time_window_size: 1
    time_window_unit: d
    kind: staging_daily

  - id: elk-alert-llm-agent-loop
    name: "[ELK Co] checkout-assistant LLM burn"
    description: 7-day LLM cost for checkout-assistant above agent-loop floor.
    schedule: 1h
    time_window_size: 7
    time_window_unit: d
    kind: checkout_7d

  - id: elk-alert-gcp-ml-burn
    name: "[ELK Co] ML platform GCP project burn"
    description: 7-day GCP billing for elk-ml-prod above ML-burn floor.
    schedule: 1h
    time_window_size: 7
    time_window_unit: d
    kind: gcp_ml_7d

  - id: elk-alert-bedrock-7d
    name: "[ELK Co] Bedrock 7d LLM burn"
    description: 7-day APM gen_ai cost for aws.bedrock above floor.
    schedule: 1h
    time_window_size: 7
    time_window_unit: d
    kind: bedrock_7d

  - id: elk-alert-inference-7d
    name: "[ELK Co] Elastic Inference 7d token burn"
    description: 7-day Agent Builder inference tokens above floor.
    schedule: 1h
    time_window_size: 7
    time_window_unit: d
    kind: inference_7d
