# LLM-pack FinOps budgets — openai / anthropic / elastic-ai workshop variants.
# No AWS CUR / GCP / Azure billing SLOs (those indices are not seeded here).

tags:
  - elk-co
  - finops
  - workshop
  - llm

budgets:
  checkout_daily_ceiling_usd: 0.50
  checkout_7d_alert_usd: 4.0
  inference_daily_tokens: 200000
  inference_7d_tokens: 800000

slos:
  - id: elk-slo-llm-checkout-spend
    name: "[ELK Co] checkout-assistant daily LLM cost"
    description: >
      Daily gen_ai span cost for checkout-assistant under ceiling. The
      llm_agent_loop scenario (−8..−6, ×12) burns this budget.
    index: traces-apm-default
    filter: 'span.subtype : "gen_ai" and service.name : "checkout-assistant"'
    field: labels.llm_cost_usd
    ceiling_key: checkout_daily_ceiling_usd
    burn_rate_alert: true

  - id: elk-slo-inference-daily-tokens
    name: "[ELK Co] Elastic Inference daily token budget"
    description: >
      Daily Elastic Inference tokens for Agent Builder under ceiling.
    index: logs-elastic.inference_token_usage-default
    filter: 'inference.feature_id : "agent_builder" or tags : "synthetic"'
    field: token_usage.total_tokens
    ceiling_key: inference_daily_tokens
    burn_rate_alert: false

alerts:
  - id: elk-alert-llm-agent-loop
    name: "[ELK Co] checkout-assistant LLM burn"
    description: 7-day LLM cost for checkout-assistant above agent-loop floor.
    schedule: 1h
    time_window_size: 7
    time_window_unit: d
    kind: checkout_7d

  - id: elk-alert-inference-7d
    name: "[ELK Co] Elastic Inference 7d token burn"
    description: 7-day Agent Builder inference tokens above floor.
    schedule: 1h
    time_window_size: 7
    time_window_unit: d
    kind: inference_7d
