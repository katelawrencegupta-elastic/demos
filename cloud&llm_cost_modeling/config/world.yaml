# Meridian Dynamics -- fictional org powering all synthetic data.
# Everything downstream (activity, security findings, billing) derives from
# this file plus the deterministic expansion in src/world/model.py.
#
# Complexity notes (v2):
# - 5 BUs incl. Embedded FinTech + shadow-IT Skunkworks
# - 9 AWS accounts / 5 GCP projects / 3 Azure subscriptions
# - ~120 EC2, ~46 GCE, ~27 Azure VMs; 25 identities
# - Scenarios: crypto mining, ML burn, cost leak, S3 public exposure,
#   GenAI shadow-IT ramp, Sunday ETL batch window
company: Meridian Dynamics
domain: meridiandynamics.io
seed: 42

business_units:
  - key: ecommerce
    name: E-Commerce
    cost_center: CC-1001
  - key: mlplatform
    name: ML Platform
    cost_center: CC-2040
  - key: corpit
    name: Corporate IT
    cost_center: CC-3300
  - key: fintech
    name: Embedded FinTech
    cost_center: CC-5120
  - key: skunkworks
    name: R&D Skunkworks
    cost_center: null   # shadow IT -- no cost center assigned on purpose

