# Scenario windows are expressed in days relative to "now" (negative = past).
scenarios:
  crypto_incident:
    aws_account: "333333333333"     # meridian-dev
    start_day: -12
    end_day: -9
  ml_burn:
    gcp_project: meridian-ml-prod
    start_day: -20
    end_day: -16
    cost_multiplier: 3.8
  cost_leak:
    aws_account: "222222222222"     # meridian-staging: orphaned resources, spend w/o activity
    daily_cost_usd: 340.0
  s3_exposure:
    aws_account: "888888888888"     # fintech-prod: bucket accidentally made public
    bucket: meridian-fintech-exports
    start_day: -6
    end_day: -4
  genai_ramp:
    gcp_project: meridian-genai-poc  # skunkworks shadow-IT GPU spend, ramping up
    start_day: -15
    end_multiplier: 2.8
  # --- LLM-specific narratives ---
  llm_agent_loop:
    app: checkout-assistant         # buggy retry loop burns tokens
    start_day: -8
    end_day: -6
    rate_multiplier: 12.0
  llm_model_migration:
    app: support-copilot            # migrates openai -> anthropic mid-window
    cutover_day: -14
    from_provider: openai
    to_provider: anthropic
  llm_cache_miss_storm:
    app: rag-research
    start_day: -5
    end_day: -3
    cache_hit_rate: 0.05            # normally ~0.55
  growth_pct_per_day: 0.8           # organic month-over-month growth
