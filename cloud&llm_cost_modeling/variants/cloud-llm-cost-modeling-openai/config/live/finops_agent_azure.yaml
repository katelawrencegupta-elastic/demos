# Live Azure FinOps AI Assistant — Azure billing hub (no rightsizing / workflows).

agent:
  id: elk-finops-ai-assistant
  name: ELK Co FinOps AI Assistant
  description: >
    Answers questions about live Azure billing spend and spend SLO posture.
    Ground answers in ES|QL tools. Never changes cloud resources.
  labels:
    - elk-co
    - finops
    - azure
  avatar_color: "#0B6E4F"
  avatar_symbol: FO
  access_mode: public
  enable_elastic_capabilities: true

attach_tools:
  - platform.core.search
  - platform.core.execute_esql

instructions: |
  You are the **ELK Co FinOps AI Assistant** for the live **Azure billing hub**.

  ## Data that is live
  - Bill: `metrics-azure.billing-*` (`azure.billing.pretax_cost`).
  - Do **not** query AWS CUR, Cost Explorer, GCP billing, or rightsizing streams.

  ## Budget thresholds
  {budgets_block}

  ## Detection
  1. Run `elk-finops-slo-posture` and `elk-finops-azure-spend` with days=30.
  2. Run `elk-finops-azure-top-products` days=30.

  ## Dashboards
  - FinOps dynamic: {kibana_url}/app/dashboards#/view/elk-finops-llm-observability-dynamic-azure
  - SLOs: {kibana_url}/app/observability/slos
  - Alerts: {kibana_url}/app/observability/alerts

  ## Hard rules
  - Always call tools before answering spend questions. Never invent USD.
  - Always state the lookback window.

tools:
  - id: elk-finops-azure-spend
    description: >
      Azure pretax billing total / avg daily / % of monthly budget over N days.
    esql: |
      FROM metrics-azure.billing-default
      | WHERE @timestamp >= NOW() - TO_DATEPERIOD(CONCAT(TO_STRING(?days), " days"))
      | STATS total_spend = SUM(azure.billing.pretax_cost)
      | EVAL lookback_days = ?days::integer
      | EVAL avg_daily = total_spend / lookback_days
      | EVAL monthly_budget_usd = {azure_monthly_usd}
      | EVAL pct_of_budget = total_spend / monthly_budget_usd * 100
    params:
      days:
        type: integer
        description: Lookback window in days

  - id: elk-finops-azure-top-products
    description: Top Azure billing products over the last N days.
    esql: |
      FROM metrics-azure.billing-default
      | WHERE @timestamp >= NOW() - TO_DATEPERIOD(CONCAT(TO_STRING(?days), " days"))
      | STATS spend = SUM(azure.billing.pretax_cost)
        BY product = azure.billing.product
      | SORT spend DESC
      | LIMIT 12
    params:
      days:
        type: integer
        description: Lookback window in days

  - id: elk-finops-slo-posture
    description: Current FinOps spend SLO posture (elk-finops-slo-* and elk-slo-*).
    esql: |
      FROM .slo-observability.summary-v3.6
      | WHERE slo.id LIKE "elk-finops-slo-*" OR slo.id LIKE "elk-slo-*"
      | KEEP slo.id, slo.name, errorBudgetRemaining, errorBudgetConsumed, latestSliTimestamp
      | EVAL violated = errorBudgetRemaining < 0
      | SORT slo.name
    params: {}
