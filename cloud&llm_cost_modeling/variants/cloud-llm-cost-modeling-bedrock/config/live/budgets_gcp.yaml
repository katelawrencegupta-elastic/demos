# Live GCP FinOps billing hub — native metrics-gcp.billing-* + shared LLM.
# No Cost Explorer / rightsizing / workflows (AWS-only).

tags:
  - elk-co
  - finops
  - live
  - gcp

budgets:
  gcp_monthly_usd: 80000
  gcp_daily_ceiling_usd: 3500
  gcp_ml_daily_ceiling_usd: 1200
  gcp_ml_7d_alert_usd: 4000
  checkout_daily_ceiling_usd: 0.50
  checkout_7d_alert_usd: 4.0
  inference_daily_tokens: 200000
  inference_7d_tokens: 800000

slos:
  - id: elk-finops-slo-gcp-daily
    name: "[ELK Co] GCP daily billing under ceiling"
    description: Daily GCP billing total must stay at or below the FinOps ceiling.
    index: metrics-gcp.billing-default
    filter: ""
    field: gcp.billing.total
    ceiling_key: gcp_daily_ceiling_usd
    burn_rate_alert: false

  - id: elk-finops-slo-gcp-ml-daily
    name: "[ELK Co] GCP elk-ml-prod daily spend healthy"
    description: >
      elk-ml-prod daily GCP billing under ceiling. ML-burn scenarios breach this.
    index: metrics-gcp.billing-default
    filter: 'gcp.billing.project_name : "{gcp_ml_project}"'
    field: gcp.billing.total
    ceiling_key: gcp_ml_daily_ceiling_usd
    burn_rate_alert: true

  - id: elk-slo-llm-checkout-spend
    name: "[ELK Co] checkout-assistant daily LLM cost"
    description: Daily gen_ai span cost for checkout-assistant under ceiling.
    index: traces-apm-default
    filter: 'span.subtype : "gen_ai" and service.name : "checkout-assistant"'
    field: labels.llm_cost_usd
    ceiling_key: checkout_daily_ceiling_usd
    burn_rate_alert: true

  - id: elk-slo-inference-daily-tokens
    name: "[ELK Co] Elastic Inference daily token budget"
    description: Daily Elastic Inference tokens for Agent Builder under ceiling.
    index: logs-elastic.inference_token_usage-default
    filter: 'inference.feature_id : "agent_builder" or tags : "synthetic"'
    field: token_usage.total_tokens
    ceiling_key: inference_daily_tokens
    burn_rate_alert: false

alerts:
  - id: elk-finops-alert-gcp-mtd
    name: "[ELK Co] GCP trailing-30d spend over monthly budget"
    schedule: 1h
    time_window_size: 30
    time_window_unit: d
    message: "FinOps: GCP trailing-30d billing exceeded ${gcp_monthly_usd:,}"
    esql: |
      FROM metrics-gcp.billing-default
      | STATS spend = SUM(gcp.billing.total)
      | WHERE spend > {gcp_monthly_usd}

  - id: elk-alert-gcp-ml-burn
    name: "[ELK Co] ML platform GCP project burn"
    schedule: 1h
    time_window_size: 7
    time_window_unit: d
    message: "FinOps: elk-ml-prod 7d GCP billing exceeded ${gcp_ml_7d_alert_usd:,}"
    esql: |
      FROM metrics-gcp.billing-default
      | WHERE gcp.billing.project_name == "{gcp_ml_project}"
      | STATS spend = SUM(gcp.billing.total)
      | WHERE spend > {gcp_ml_7d_alert_usd}
