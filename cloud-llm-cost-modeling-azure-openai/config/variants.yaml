# Workshop fork profiles — each variant scopes generators, Fleet packages,
# setup steps, and dashboard publishing to one cloud or integration pack.
#
# Materialize forks:  python scripts/fork_project.py --all
# Active fork:         config/active_variant.yaml  (or MERIDIAN_VARIANT env)

variants:
  all:
    title: "Meridian FinOps & LLM Observability — full multi-cloud"
    fork_dir: cloud-llm-cost-modeling-all
    default_scope: all
    generators: all
    packages:
      - aws
      - gcp
      - azure
      - azure_billing
      - openai
      - anthropic
      - anthropic_metrics
      - azure_openai
      - aws_bedrock
      - gcp_vertexai
      - aws_billing
      - apm
    setup:
      tsds: true
      cur: true
      aws_billing: true
      openai: true
      azure_openai: true
      anthropic: true
      vertexai: true
      bedrock: true
      ess_billing: true
      apm: true
      inference: true
      budgets: true
      agent: true
    dashboards:
      baseline: true
      classic: true
      dynamic: true
      ai: true
    ootb_links:
      - ess_billing
      - aws_cur
      - gcp_billing
      - azure_billing
      - anthropic
      - openai
      - azure_openai
      - bedrock
      - vertexai
      - apm

