input {
  pipeline {
    address => "main"
  }
}

filter {
  # Netflow codec expands one UDP datagram into multiple events without input tags.
  if [netflow] {
    mutate {
      add_tag => ["netflow"]
    }
    mutate {
      copy => { "[netflow][dst_tos]" => "[netflow][src_tos]" }
    }
    # Overview dashboard uses netflow.ip_class_of_service (numeric TOS / DSCP).
    if [netflow][dst_tos] {
      mutate {
        copy => { "[netflow][dst_tos]" => "[netflow][ip_class_of_service]" }
      }
    } else if [netflow][src_tos] {
      mutate {
        copy => { "[netflow][src_tos]" => "[netflow][ip_class_of_service]" }
      }
    }
    # Netflow integration dashboards expect tcp_control_bits (Elastic Agent field name).
    if [netflow][tcp_flags] and ![netflow][tcp_control_bits] {
      mutate {
        copy => { "[netflow][tcp_flags]" => "[netflow][tcp_control_bits]" }
      }
    }
    if ![netflow][dst_mask] {
      mutate {
        add_field => { "[netflow][dst_mask]" => 0 }
      }
    }
    if ![netflow][src_mask] {
      mutate {
        add_field => { "[netflow][src_mask]" => 0 }
      }
    }
    if ![netflow][direction] {
      mutate {
        add_field => { "[netflow][direction]" => 0 }
      }
    }
    # Flow Exporters dashboard expects ingress/egress_interface (long), not input/output_snmp.
    if [netflow][input_snmp] {
      mutate {
        copy => { "[netflow][input_snmp]" => "[netflow][ingress_interface]" }
      }
    }
    if [netflow][output_snmp] {
      mutate {
        copy => { "[netflow][output_snmp]" => "[netflow][egress_interface]" }
      }
    }
    # Synthetic flow exporter metadata for Netflow integration dashboards.
    mutate {
      add_field => {
        "[agent][name]" => "netflow-demo-exporter"
        "[agent][type]" => "logstash"
        "[observer][ip]" => "10.0.0.1"
        "[netflow][exporter][address]" => "10.0.0.1:2055"
      }
      copy => { "[netflow][version]" => "[netflow][exporter][version]" }
    }
  }

  # Logstash 8 syslog input (ECS) stores the tag in [process][name], not [program].
  if "syslog" in [tags] and ![program] and [process][name] {
    mutate {
      copy => { "[process][name]" => "program" }
    }
  }

  if "syslog" in [tags] and [program] == "endpoint-process-demo" {
    json {
      source => "message"
      target => "process_event"
    }
    if [process_event] {
      if [process_event][@timestamp] {
        date {
          match => [ "[process_event][@timestamp]", "ISO8601" ]
          target => "@timestamp"
        }
      }
      ruby {
        code => '
          payload = event.get("process_event")
          return unless payload.is_a?(Hash)
          payload.each do |key, value|
            next if key == "@timestamp"
            event.set(key, value)
          end
          event.remove("process_event")
          event.remove("message")
        '
      }
      mutate {
        add_tag => ["endpoint_process"]
        add_field => {
          "[data_stream][type]" => "logs"
          "[data_stream][dataset]" => "endpoint.events.process"
          "[data_stream][namespace]" => "default"
        }
      }
    }
  }

  if "syslog" in [tags] and [program] == "exfil-demo" and [message] =~ /^\{/ {
    json {
      source => "message"
      target => "exfil_event"
    }
    if [exfil_event] {
      if [exfil_event][@timestamp] {
        date {
          match => [ "[exfil_event][@timestamp]", "ISO8601" ]
          target => "@timestamp"
        }
      }
      mutate {
        rename => {
          "[exfil_event][event]" => "[event]"
          "[exfil_event][tags]" => "[tags]"
          "[exfil_event][network]" => "[network]"
          "[exfil_event][source]" => "[source]"
          "[exfil_event][destination]" => "[destination]"
          "[exfil_event][file]" => "[file]"
          "[exfil_event][http]" => "[http]"
          "[exfil_event][url]" => "[url]"
          "[exfil_event][exfil]" => "[exfil]"
        }
        add_tag => ["exfil", "data_loss"]
        add_field => {
          "[data_stream][type]" => "logs"
          "[data_stream][dataset]" => "exfil.transfer"
          "[data_stream][namespace]" => "default"
        }
      }
      mutate {
        remove_field => ["exfil_event", "message"]
      }
    }
  }

  if "syslog" in [tags] and [program] == "beacon-demo" and [message] =~ /^\{/ {
    json {
      source => "message"
      target => "beacon_event"
    }
    if [beacon_event] {
      if [beacon_event][@timestamp] {
        date {
          match => [ "[beacon_event][@timestamp]", "ISO8601" ]
          target => "@timestamp"
        }
      }
      mutate {
        rename => {
          "[beacon_event][event]" => "[event]"
          "[beacon_event][tags]" => "[tags]"
          "[beacon_event][host]" => "[host]"
          "[beacon_event][process]" => "[process]"
          "[beacon_event][network]" => "[network]"
          "[beacon_event][source]" => "[source]"
          "[beacon_event][destination]" => "[destination]"
          "[beacon_event][beacon]" => "[beacon]"
        }
        add_tag => ["beacon", "c2"]
        add_field => {
          "[data_stream][type]" => "logs"
          "[data_stream][dataset]" => "network_traffic.flow"
          "[data_stream][namespace]" => "default"
        }
      }
      mutate {
        remove_field => ["beacon_event", "message"]
      }
    }
  }

  if "syslog" in [tags] and [program] == "dga-demo" and [message] =~ /^\{/ {
    json {
      source => "message"
      target => "dga_event"
    }
    if [dga_event] {
      if [dga_event][@timestamp] {
        date {
          match => [ "[dga_event][@timestamp]", "ISO8601" ]
          target => "@timestamp"
        }
      }
      mutate {
        rename => {
          "[dga_event][event]" => "[event]"
          "[dga_event][tags]" => "[tags]"
          "[dga_event][network]" => "[network]"
          "[dga_event][source]" => "[source]"
          "[dga_event][destination]" => "[destination]"
          "[dga_event][dns]" => "[dns]"
          "[dga_event][dga]" => "[dga]"
        }
        add_tag => ["dga", "dns"]
        add_field => {
          "[data_stream][type]" => "logs"
          "[data_stream][dataset]" => "dga.dns"
          "[data_stream][namespace]" => "default"
        }
      }
      mutate {
        remove_field => ["dga_event", "message"]
      }
    }
  }

  if "syslog" in [tags] and [program] == "dga-demo" and [message] =~ /^\[\d+:\d+:\d+\]/ {
    mutate {
      add_tag => ["dga", "snort"]
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "dga.alert"
        "[data_stream][namespace]" => "default"
      }
    }
  }

  if "syslog" in [tags] and [program] != "dga-demo" and ([program] == "snort" or [message] =~ /^\[\d+:\d+:\d+\]/) {
    mutate {
      add_tag => ["snort"]
    }
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "snort.log"
        "[data_stream][namespace]" => "default"
      }
    }
  }

  if "beats" in [tags] and [agent][type] == "packetbeat" {
    if [event][dataset] =~ /^network_traffic\./ {
      mutate {
        add_field => { "[data_stream][dataset]" => "%{[event][dataset]}" }
      }
    } else if [event][dataset] {
      mutate {
        add_field => { "[data_stream][dataset]" => "network_traffic.%{[event][dataset]}" }
      }
    } else if [type] {
      mutate {
        add_field => { "[data_stream][dataset]" => "network_traffic.%{[type]}" }
      }
    } else {
      mutate {
        add_field => { "[data_stream][dataset]" => "network_traffic.flow" }
      }
    }
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][namespace]" => "default"
      }
    }
    # Network Errors over Time panel filters on status != OK (excludes network_traffic.flow).
    if [http][response][status_code] {
      if [http][response][status_code] >= 500 {
        mutate { replace => { "status" => "Server Error" } }
      } else if [http][response][status_code] >= 400 {
        mutate { replace => { "status" => "Client Error" } }
      } else if ![status] {
        mutate { add_field => { "status" => "OK" } }
      }
    } else if [dns][response_code] and [dns][response_code] != "NOERROR" {
      mutate { replace => { "status" => "Client Error" } }
    } else if ![status] {
      mutate { add_field => { "status" => "OK" } }
    }

    # Map panels (e.g. Client IP Locations) require client.geo.location.
    if [client][ip] {
      geoip {
        source => "[client][ip]"
        target => "[client][geo]"
        ecs_compatibility => disabled
      }
    }
    if [server][ip] {
      geoip {
        source => "[server][ip]"
        target => "[server][geo]"
        ecs_compatibility => disabled
      }
    }
    if [source][ip] {
      geoip {
        source => "[source][ip]"
        target => "[source][geo]"
        ecs_compatibility => disabled
      }
    }
    if [destination][ip] {
      geoip {
        source => "[destination][ip]"
        target => "[destination][geo]"
        ecs_compatibility => disabled
      }
    }
    # Demo container traffic uses loopback / RFC1918 IPs GeoIP cannot resolve.
    ruby {
      code => '
        demo = {
          "city_name" => "San Francisco",
          "region_name" => "California",
          "country_name" => "United States",
          "country_iso_code" => "US",
          "location" => { "lat" => 37.7749, "lon" => -122.4194 }
        }
        loopback = ["127.0.0.1", "::1"]
        private_ip = /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/
        resolvers = {
          "1.1.1.1" => {
            "country_name" => "Australia",
            "country_iso_code" => "AU",
            "location" => { "lat" => -27.4766, "lon" => 153.0166 }
          }
        }
        ["client", "source", "server", "destination"].each do |role|
          ip = event.get("[#{role}][ip]")
          geo = event.get("[#{role}][geo]")
          next unless ip && (geo.nil? || geo["location"].nil?)
          if resolvers.key?(ip)
            event.set("[#{role}][geo]", resolvers[ip])
          elsif loopback.include?(ip) || ip =~ private_ip
            event.set("[#{role}][geo]", demo)
          end
        end
      '
    }
  }

  # Elastic detection rules with timestamp_override: event.ingested need this field.
  if ![event][ingested] {
    ruby {
      code => "event.set('[event][ingested]', Time.now.utc.iso8601(3))"
    }
  }
}

output {
  if "netflow" in [tags] or [type] == "netflow" or [netflow][version] {
    elasticsearch {
      hosts => ["${ELASTIC_HOSTS}"]
      api_key => "${ELASTIC_API_KEY}"
      ssl_enabled => true
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "netflow.log"
      data_stream_namespace => "default"
      pipeline => "logs-netflow.log-2.25.1-klg"
    }
  } else if "beats" in [tags] and [agent][type] == "packetbeat" {
    # Fleet integration pipelines (incl. 3.0.1-ml_dga_ingest_pipeline on DNS).
    elasticsearch {
      hosts => ["${ELASTIC_HOSTS}"]
      api_key => "${ELASTIC_API_KEY}"
      ssl_enabled => true
      data_stream => true
      pipeline => "logs-%{[data_stream][dataset]}-1.34.2"
    }
  } else if "endpoint_process" in [tags] {
    elasticsearch {
      hosts => ["${ELASTIC_HOSTS}"]
      api_key => "${ELASTIC_API_KEY}"
      ssl_enabled => true
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "endpoint.events.process"
      data_stream_namespace => "default"
    }
  } else if "exfil" in [tags] and "data_loss" in [tags] {
    elasticsearch {
      hosts => ["${ELASTIC_HOSTS}"]
      api_key => "${ELASTIC_API_KEY}"
      ssl_enabled => true
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "exfil.transfer"
      data_stream_namespace => "default"
    }
  } else if "beacon" in [tags] and "c2" in [tags] {
    elasticsearch {
      hosts => ["${ELASTIC_HOSTS}"]
      api_key => "${ELASTIC_API_KEY}"
      ssl_enabled => true
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "network_traffic.flow"
      data_stream_namespace => "default"
      pipeline => "logs-network_traffic.flow-1.34.2"
    }
  } else if "dga" in [tags] and "dns" in [tags] {
    elasticsearch {
      hosts => ["${ELASTIC_HOSTS}"]
      api_key => "${ELASTIC_API_KEY}"
      ssl_enabled => true
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "dga.dns"
      data_stream_namespace => "default"
      pipeline => "logs-dga.dns-1.0.0"
    }
  } else if "dga" in [tags] and "snort" in [tags] {
    elasticsearch {
      hosts => ["${ELASTIC_HOSTS}"]
      api_key => "${ELASTIC_API_KEY}"
      ssl_enabled => true
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "dga.alert"
      data_stream_namespace => "default"
    }
  } else if "snort" in [tags] {
    elasticsearch {
      hosts => ["${ELASTIC_HOSTS}"]
      api_key => "${ELASTIC_API_KEY}"
      ssl_enabled => true
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "snort.log"
      data_stream_namespace => "default"
      pipeline => "logs-snort.log-1.21.2"
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTIC_HOSTS}"]
      api_key => "${ELASTIC_API_KEY}"
      ssl_enabled => true
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "syslog"
      data_stream_namespace => "default"
    }
  }
}
