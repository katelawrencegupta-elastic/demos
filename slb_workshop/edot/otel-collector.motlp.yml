# Default workshop collector: OTLP + filelog → Elastic Cloud Managed OTLP Endpoint.
# This is the supported EDOT path on Serverless (not APM Server OTLP).
receivers:
  filelog/workshop:
    include:
      - /var/log/workshop/*.log
    start_at: beginning
    operators:
      - type: json_parser
        parse_from: body
        if: body matches "^\\{"
        on_error: send
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
  resource/workshop:
    attributes:
      - key: deployment.environment
        value: workshop
        action: upsert

exporters:
  otlphttp/motlp:
    endpoint: ${env:ELASTIC_OTLP_ENDPOINT}
    headers:
      Authorization: ApiKey ${env:ELASTIC_API_KEY}
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 50000000
      block_on_overflow: true
      batch:
        flush_timeout: 1s
        min_size: 1000000
        max_size: 4000000

service:
  pipelines:
    logs:
      receivers: [filelog/workshop, otlp]
      processors: [resource/workshop, batch]
      exporters: [otlphttp/motlp]
    traces:
      receivers: [otlp]
      processors: [resource/workshop, batch]
      exporters: [otlphttp/motlp]
    metrics:
      receivers: [otlp]
      processors: [resource/workshop, batch]
      exporters: [otlphttp/motlp]
